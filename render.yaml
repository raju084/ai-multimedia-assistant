services:
  - type: web
    name: ai-multimedia-backend
    env: python
    buildCommand: "./backend/build.sh"
    startCommand: "gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --log-level debug"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: GROQ_API_KEY
        fromEnvVar: GROQ_API_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ai-multimedia-db
          property: connectionString
    disk:
      name: media-storage
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1

databases:
  - name: ai-multimedia-db
    plan: free
